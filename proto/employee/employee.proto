syntax = "proto3";
 
package employee;
 
option go_package = ".;employeepb";
 
message Employee {
    string ID = 1;
    string Name = 2;
    string Designation = 3;
    string Department = 4;
    string JoiningDate = 5;
    string Address = 6;
    string OfficeLocation = 7;
    string Status = 8;
    string EmailID = 9;
    string PhoneNumber = 10;
}
 
message CreateEmployeeRequest {
    Employee employee = 1; // Employee id blank
}
 
message CreateEmployeeResponse {
    Employee employee = 1; // Employee id filled in
}
 
message GetEmployeeRequest {
    string id = 1;
}
 
message GetEmployeeResponse {
    Employee employee = 1;
}
 
message UpdateEmployeeRequest {
    Employee employee = 1;
}
 
message UpdateEmployeeResponse {
    Employee employee = 1;
}
 
message DeleteEmployeeRequest {
    string id = 1;
}
 
message DeleteEmployeeResponse {
    bool success = 1;
}
 
message GetAllEmployeesRequest {}
 
message GetAllEmployeesResponse {
    Employee employee = 1;
}
 
service EmployeeService {
    rpc CreateEmployee(CreateEmployeeRequest) returns (CreateEmployeeResponse);
    rpc GetEmployee(GetEmployeeRequest) returns (GetEmployeeResponse);
    rpc GetAllEmployees(GetAllEmployeesRequest) returns (stream GetAllEmployeesResponse);
    rpc UpdateEmployee(UpdateEmployeeRequest) returns (UpdateEmployeeResponse);
    rpc DeleteEmployee(DeleteEmployeeRequest) returns (DeleteEmployeeResponse);
}